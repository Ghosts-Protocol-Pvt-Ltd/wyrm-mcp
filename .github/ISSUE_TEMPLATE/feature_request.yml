name: Idea / feature request
description: Suggest something Wyrm should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Shortcut: `wyrm feedback --idea "your idea"` opens this prefilled. For
        open-ended "what if..." conversations, Discussions > Ideas is a better fit.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should Wyrm do that it does not today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: The problem it solves, or the workflow it unblocks.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
      description: Current workaround, if any.
    validations:
      required: false
